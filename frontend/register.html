<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 16px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #eef2f7 0%, #dbe4f0 100%);
      color: var(--text);
      padding: 20px;
    }
    .auth-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      color: #1e293b;
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 28px;
    }
    form { display: flex; flex-direction: column; gap: 14px; }
    .input-group {
      position: relative;
      text-align: left;
    }
    .input-group .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }
    input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #fafbfc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background: #fff;
    }
    button {
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    button:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }
    .error {
      color: #dc2626;
      font-size: 14px;
      min-height: 20px;
      margin: 14px 0 0;
      font-weight: 500;
    }
    .switch-text {
      color: var(--muted);
      font-size: 14px;
      margin: 18px 0 0;
    }
    .switch-text a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    .switch-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1>✨ Đăng ký tài khoản</h1>
    <p class="subtitle">Tạo tài khoản mới để bắt đầu sử dụng.</p>

    <form id="register-form">
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" id="fullName" placeholder="Họ tên" required />
      </div>
      <div class="input-group">
        <span class="input-icon">📧</span>
        <input type="email" id="email" placeholder="Email" required />
      </div>
      <div class="input-group">
        <span class="input-icon">🔑</span>
        <input type="password" id="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" minlength="6" required />
      </div>
      <div class="input-group">
        <span class="input-icon">✅</span>
        <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu" required />
      </div>
      <button type="submit">Đăng ký →</button>
    </form>

    <p class="error" id="message"></p>
    <p class="switch-text">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
  </div>

  <script src="auth.js"></script>
  <script>
    if (tokenStorage.get()) {
      window.location.href = 'profile.html';
    }

    const form = document.getElementById('register-form');
    const messageEl = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.textContent = '';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Validate client trước khi gửi
      if (password !== confirmPassword) {
        messageEl.textContent = 'Xác nhận mật khẩu không khớp';
        return;
      }

      const payload = {
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        password
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          messageEl.textContent = data.message || 'Đăng ký thất bại';
          return;
        }

        // Auto-login: lưu token rồi vào thẳng trang profile
        tokenStorage.set(data.data.token);
        window.location.href = 'profile.html';
      } catch (err) {
        messageEl.textContent = 'Lỗi kết nối, vui lòng thử lại';
      }
    });
  </script>
</body>
</html>
